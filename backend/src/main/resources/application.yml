# .env lives at the repo root, because Docker Compose reads it from there. A
# native `./mvnw spring-boot:run` starts the JVM in backend/, so spring-dotenv
# has to be pointed one level up or it finds nothing and silently falls back to
# the defaults below. Inside the container the variables are real environment
# variables and no file is read at all.
springdotenv:
  directory: ..
  ignore-if-missing: true

spring:
  application:
    name: movieuniverse
  datasource:
    # POSTGRES_PORT is intentionally absent from .env.example so the default below
    # applies. Set it only if something already owns 5432 on your machine.
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/movieuniverse
    username: ${POSTGRES_USER:movieuniverse}
    password: ${POSTGRES_PASSWORD:movieuniverse}
  jpa:
    hibernate:
      # Flyway owns the schema. Hibernate only checks that entities match it.
      ddl-auto: validate
    # Off by default here: Spring's default of true holds a session open for the
    # whole request and hides lazy-loading mistakes until they become slow queries.
    open-in-view: false
  flyway:
    enabled: true

tmdb:
  base-url: https://api.themoviedb.org/3
  read-access-token: ${TMDB_API_READ_TOKEN}
  # Explicit rather than relying on the account default, so stored titles and
  # overviews are English regardless of whose key is used.
  language: en-US

app:
  seed:
    # Import only into an empty database, so restarting does not undo edits made
    # through the UI. Use --import=<location> to load a file on top of existing data.
    auto-on-empty: true
    files:
      - classpath:data/seed_playlists.json
    # The seed file carries usernames but no credentials, so seeded users need an
    # invented password. Blank falls back to a literal published in the README,
    # which keeps the clone-and-run path working.
    default-password: ${SEED_DEFAULT_PASSWORD:}

logging:
  level:
    org.flywaydb: info
