services:
  # --------------------
  # PostgreSQL Database - no profile, enabling it to start in both modes
  # --------------------
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: movieuniverse
      POSTGRES_USER: ${POSTGRES_USER:-movieuniverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movieuniverse}
    # Host port is configurable: a locally installed Postgres often already owns 5432.
    ports: [ "127.0.0.1:${POSTGRES_PORT:-5432}:5432" ]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-movieuniverse} -d movieuniverse" ]
      interval: 5s
      retries: 10

  # --------------------
  # Spring Boot Backend
  # --------------------
  backend:
    profiles: [ "full" ]
    build: { context: ., dockerfile: backend/Dockerfile }
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/movieuniverse
      POSTGRES_USER: ${POSTGRES_USER:-movieuniverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-movieuniverse}
    ports: [ "127.0.0.1:8080:8080" ]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 10s
      retries: 5
      start_period: 40s

  # --------------------
  # React Frontend
  # --------------------
  frontend:
    profiles: ["full"]
    build: { context: ./frontend }
    ports: ["127.0.0.1:3000:80"]
    depends_on: { backend: {condition: service_healthy } }

volumes:
  pgdata: